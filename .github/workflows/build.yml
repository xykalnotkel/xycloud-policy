name: Build
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate policy.json (id)
        run: node -e "const p=require('./data/policy.json');if(!p.sections?.length)throw new Error('sections kosong');console.log('OK id:',p.sections.length,'sections,',p.faq.length,'faq')"
      - name: Validate policy.en.json (en)
        run: node -e "const a=require('./data/policy.json'),b=require('./data/policy.en.json');if(!b.sections?.length)throw new Error('sections kosong');const ka=a.sections.map(s=>s.id).join(),kb=b.sections.map(s=>s.id).join();if(ka!==kb)throw new Error('id section id/en tidak sinkron');console.log('OK en:',b.sections.length,'sections,',b.faq.length,'faq, id section sinkron')"
      - name: Build
        run: node scripts/build.mjs
      - name: Check output
        run: test -s public/index.html && test -s public/internal.html && test -s public/en/index.html && test -s public/en/internal.html && test -s public/sitemap.xml && echo "build OK (id + en)"
